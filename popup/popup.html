<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FormGenius</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <img src="../icons/icon48.png" alt="FormGenius" class="logo-icon" />
        <div class="logo-text">
          <span class="logo-name">FormGenius</span>
          <span class="logo-tagline">AI Form Solver</span>
        </div>
      </div>
      <div class="header-right">
        <div class="status-dot" id="statusDot" title="Status"></div>
      </div>
    </header>

    <!-- Google Form Status Banner -->
    <div class="status-banner" id="statusBanner">
      <span class="status-icon">🔍</span>
      <span class="status-text" id="statusText">Detecting Google Form...</span>
    </div>

    <!-- Gemini API Key Section -->
    <div class="section">
      <label class="label" for="apiKey">GEMINI API KEY</label>
      <div class="input-group">
        <input
          type="password"
          id="apiKey"
          class="input"
          placeholder="AIzaSy..."
          autocomplete="off"
          spellcheck="false"
        />
        <button class="eye-btn" id="toggleKey" title="Show/Hide Key" aria-label="Toggle API Key visibility">👁</button>
      </div>
      <div class="hint">
        <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link" rel="noreferrer">Get free API key →</a>
      </div>
    </div>

    <!-- Keyboard Shortcut Card -->
    <div class="shortcut-card">
      <div class="shortcut-header">
        <span class="shortcut-label">Shortcut</span>
        <div class="shortcut-keys">
          <kbd>Alt</kbd>
          <span class="shortcut-plus">+</span>
          <kbd>Shift</kbd>
          <span class="shortcut-plus">+</span>
          <kbd>S</kbd>
        </div>
      </div>
      <div class="shortcut-desc">Press on Google Form to solve</div>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button class="btn btn-primary" id="solveBtn">
        <span class="btn-icon">⚡</span>
        <span>Solve Form</span>
      </button>
      <button class="btn btn-save" id="saveBtn">
        <span class="btn-icon">💾</span>
        <span>Save Key</span>
      </button>
    </div>

    <!-- Statistics Grid -->
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="solvedCount">0</div>
        <div class="stat-label">Solved</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="questionsCount">0</div>
        <div class="stat-label">Answered</div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>v1.0.0</span>
      <span class="footer-dot">·</span>
      <span>Gemini AI</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
